# ~/.config/tmux/tmux.conf

# ─── Prefix ───────────────────────────────────────────────────────────────────
# Remap C-b → C-a. Closer to home row, frees C-b for readline (back-char) in shells.
unbind C-b
set -g prefix C-a
bind C-a send-prefix          # press C-a twice to send a literal C-a to the inner program

# ─── Responsiveness ───────────────────────────────────────────────────────────
# Kill the 500ms delay tmux waits to disambiguate escape sequences.
# Without this, vim/nvim feels laggy inside tmux (ESC → normal mode is delayed).
set -sg escape-time 0

# ─── Copy mode (vi) ───────────────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
# Forward nested OSC 52 clipboard updates from full-screen apps to the client.
set -s set-clipboard on
# Clipboard-aware applications read from iTerm2 and mirror the result into a
# tmux paste buffer. This is request-driven; tmux never polls the Mac clipboard.
set -s get-clipboard both
set -su copy-command
# tmux keeps copy-mode buffers locally; mirror them to the SSH/mosh client tty
# with OSC 52 so iTerm2 receives the copy on the Mac clipboard.
set -g @osc52-copy-command '{ printf "\033]52;c;"; tmux save-buffer - | base64 | tr -d "\n"; printf "\007"; } > "#{client_tty}"'
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel \; run-shell -b "#{E:@osc52-copy-command}"
bind -T copy-mode-vi y send -X copy-selection-and-cancel \; run-shell -b "#{E:@osc52-copy-command}"
# Default MouseDragEnd1Pane runs copy-pipe-and-cancel, which exits copy-mode and
# snaps the viewport back to the live tail. Drop the -and-cancel so a mouse
# highlight keeps the selection and the scrollback position. Press q/Escape to
# leave copy-mode when you actually want to return to the bottom.
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear \; run-shell -b "#{E:@osc52-copy-command}"
# The default prefix ] pastes tmux's last private buffer. Import the current
# iTerm2 clipboard first so tmux and macOS have one clipboard in both directions.
bind ] run-shell -b "~/.agents/scripts/tmux-paste-clipboard '#{pane_id}' '#{client_tty}'"

# ─── Splits ───────────────────────────────────────────────────────────────────
# | and - are mnemonic for the resulting split orientation.
# -c "#{pane_current_path}" makes new panes inherit CWD instead of $HOME.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ─── Pane navigation ──────────────────────────────────────────────────────────
# Smart pane switching with awareness of vim/nvim splits.
# Pairs with christoomey/vim-tmux-navigator in the LazyVim installer.
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# ─── Mouse ────────────────────────────────────────────────────────────────────
# Scroll, resize, click-to-focus. Keyboard still drives everything else.
set -g mouse on

# ─── Scrollback & color ───────────────────────────────────────────────────────
set -g history-limit 100000
set -g default-terminal "tmux-256color"
# Tc capability = 24-bit truecolor. Required for modern colorschemes in vim/nvim.
# Mosh 1.4 requires the explicit `c` clipboard selector; tmux normally leaves it empty.
set -su terminal-overrides
set -as terminal-overrides ',*256col*:Tc,*:Ms=\E]52;c;%p2%s\007'

# ─── Reload ───────────────────────────────────────────────────────────────────
bind r source-file -q ~/.config/tmux/tmux.conf \; display-message "reloaded"

# ─── Agent state ──────────────────────────────────────────────────────────────
# Claude Code / Codex / Grok hooks call `agent-tmux state` on every transition,
# which stamps @agent_state (semantic) and @agent_status (pre-rendered glyph)
# onto the window running that agent and renames it "repo:branch". Nothing
# polls; the glyph changes the moment the agent does.
#
#   ○ idle   ◐ working   ◇ monitoring   ◆ needs you   ● finished   ✖ API error
#
# ◇ is the one an agent sets by hand, when it parks on a background wait (CI, a
# monitor loop): the window is stalled on a machine rather than on you, so
# prefix a leaves it alone.
#
# prefix a walks to the next window wanting attention; prefix A opens a picker
# with each agent's state and how long it has been there.
bind a run-shell -b "~/.agents/scripts/agent-tmux jump '#{pane_id}'"
bind A run-shell -b "~/.agents/scripts/agent-tmux menu '#{pane_id}'"

# Reading a finished agent is the acknowledgement, so it stops asking for you.
# "needs you" and "error" survive being looked at — the agent is still stuck.
# A moved checkout can leave the synced script link broken until `just config`
# repairs it. Window selection must stay quiet during that interval.
set-hook -g after-select-window "run-shell -b \"test ! -x ~/.agents/scripts/agent-tmux || ~/.agents/scripts/agent-tmux seen '#{window_id}'\""

# mosh 1.4 forwards only OSC 0/1/2/8/52 and silently drops the OSC 9 that every
# "notify iTerm2 from a hook" recipe reaches for. The window title is OSC 2, so
# it is the one channel that survives to the Mac: one ● per window wanting
# attention, excluding the window already on screen.
set -g set-titles on
set -g set-titles-string "#{W:#{?#{m/r:^(waiting|done|error)$,#{@agent_state}},●,},} #S:#I:#W"

# ─── Status bar / active window highlight ─────────────────────────────────────
# Make the active window in the status bar pop. Default tmux just reverses
# colors which is easy to miss on a busy bar.
# The agent glyph sits outside the coloured pill: @agent_status ends in
# #[default], which would otherwise drop the highlight for the rest of the pill.
set -g status-style "bg=colour234,fg=colour245"
# Names are truncated only for display; #W stays whole for the picker, the
# window title, and prefix w. Several agents on one branch produce identical
# names, so the index is what tells them apart and width buys nothing — keep
# the inactive number small enough that every window stays on the bar, and
# raise it if you run fewer, longer-named sessions.
setw -g window-status-format "#{?#{@agent_status},#{@agent_status},} #I:#{=/12/…:window_name} "
setw -g window-status-current-format "#{?#{@agent_status},#{@agent_status} ,}#[fg=colour231,bg=colour129,bold] #I:#{=/26/…:window_name} #[default]"
setw -g window-status-current-style "fg=colour231,bg=colour129,bold"
setw -g window-status-style "fg=colour245,bg=colour234"
# Bright border on the active pane so it's obvious which pane has focus too.
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour129,bold"

# ─── Vim extras ───────────────────────────────────────────────────────────────
# Forward terminal focus events into the pane. vim/nvim needs this for
# :set autoread to fire and for FocusGained/FocusLost autocmds (gitgutter,
# lualine clock, etc.) to update when you switch panes/windows.
set -g focus-events on

# ─── Session persistence ──────────────────────────────────────────────────────
# A reboot otherwise costs the whole frame: eight windows, each pointing at a
# different repo or worktree. resurrect saves that layout, continuum saves it
# on a timer and restores it when the server next starts.
#
#   prefix C-s  save now      prefix C-r  restore now
#
# run-shell and status #() inherit the server PATH, not the login shell. Align
# that PATH to this server's tmux binary before loading plugins — otherwise an
# apt client against a Homebrew server (or the reverse) fails every reload with
# "server exited unexpectedly" / "'….tmux' returned 1".
run-shell "test ! -x ~/.agents/scripts/tmux-align-path || ~/.agents/scripts/tmux-align-path"
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Start the server without being asked. continuum implements this by writing a
# systemd --user unit, and that unit stops with the user manager — which, with
# lingering off, means the last logout runs its `ExecStop=tmux kill-server` and
# takes every detached agent with it. Sessions survive disconnects today only
# because tmux is nobody's unit. So arm this only once lingering makes the unit
# outlive the login; `installers/installer.sh tmux` turns lingering on.
if-shell 'test "$(loginctl show-user "$USER" -p Linger --value 2>/dev/null)" = yes' \
    "set -g @continuum-boot 'on'"

# Pane scrollback stays out of the save file. Nothing prunes ~/.tmux/resurrect,
# so capturing 100k lines per pane every 15 minutes grows without bound, and
# for agent windows it duplicates a transcript the agent already keeps. Turn it
# on with @resurrect-capture-pane-contents 'on' if you want it anyway.
#
# @resurrect-processes is left at its default (editors, pagers, top). Agent
# CLIs are deliberately not in it: restoring eight of them would spend real
# money on a boot you did not ask for. Start them yourself, with --resume.

# Sourced only once present, so a config sync that runs before
# `installers/installer.sh tmux` reloads clean instead of erroring every time.
if-shell "test -e ~/.tmux/plugins/tmux-resurrect/resurrect.tmux" \
    "run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux"
if-shell "test -e ~/.tmux/plugins/tmux-continuum/continuum.tmux" \
    "run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux"

# The periodic save is a #() in status-right, evaluated every status-interval.
# continuum adds it on load, but only when it thinks no other tmux exists, and
# that check counts every "^tmux" process this user owns — the `tmux
# new-session` calls agents make keep auto-save permanently disarmed. Assign it
# here, last, so the value is the same whichever way that check went: assigning
# after the plugin discards continuum's copy instead of stacking a second one
# (its dedupe compares literal strings and it writes an absolute path, so the
# ~ below would not match). The tail is tmux's default status-right, kept so
# the clock and pane title survive the assignment.
set -g status-right '#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}"#{=21:pane_title}" %H:%M %d-%b-%y'
