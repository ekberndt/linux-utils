# Warp denies OSC 52 by default, so a remote tmux copy never reaches the Mac.
# read_write is the shared clipboard: copies out land on macOS, and prefix ]
# can read the Mac clipboard back over SSH.
[terminal]
osc52_clipboard_access = "read_write"

# Disable PR/diff chips, AI toolbars, and code-review overlays. Even with
# is_any_ai_enabled = false, default toolbar chip sets cause every TerminalView
# pane to subscribe to LocalGitRepoStatusModel and LocalGitHubRepoModel,
# spawning 100+ concurrent git/gh subprocesses across open worktrees.
[appearance.vertical_tabs]
show_pr_link = false
show_diff_stats = false

[code.editor]
show_code_review_button = false
show_code_review_diff_stats = false
show_project_explorer = false
show_global_search = false

[warp_drive]
enabled = false

[agents.third_party]
should_render_cli_agent_toolbar = false
cli_agent_toolbar_chip_selection_setting = { custom = { left = [], right = [] } }

[agents.warp_agent]
is_any_ai_enabled = false

[agents.warp_agent.input]
agent_toolbar_chip_selection_setting = { custom = { left = [], right = [] } }

[agents.warp_agent.other]
show_agent_notifications = false
should_render_use_agent_toolbar_for_user_commands = false

# Secret redaction scans every output line against regex_automata on the render
# path; keep it off alongside telemetry.
[privacy]
crash_reporting_enabled = false
telemetry_enabled = false

[privacy.secret_redaction]
enabled = false

[warpify.ssh]
enable_ssh_warpification = false

[system]
prefer_low_power_gpu = true
