model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
plan_mode_reasoning_effort = "xhigh"
personality = "pragmatic"
approval_policy = "never"
default_permissions = ":danger-full-access"
web_search = "live"
service_tier = "fast"
approvals_reviewer = "auto_review"

[features]
hooks = true
prevent_idle_sleep = true

[agents]
max_threads = 10
max_depth = 1

[tui]
status_line = ["project-name", "git-branch", "current-dir", "thread-title", "branch-changes", "model", "reasoning"]

# Report turn state onto the tmux window running this agent. See
# scripts/agent-tmux; Codex has no Notification event, so PermissionRequest is
# the "needs you" signal and StopFailure has no counterpart.

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = '~/.agents/scripts/agent-tmux state idle'

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = '~/.agents/scripts/agent-tmux state busy'

[[hooks.PermissionRequest]]

[[hooks.PermissionRequest.hooks]]
type = "command"
command = '~/.agents/scripts/agent-tmux state waiting'

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = '~/.agents/scripts/agent-tmux state done'

[[hooks.SessionEnd]]

[[hooks.SessionEnd.hooks]]
type = "command"
command = '~/.agents/scripts/agent-tmux state clear'
